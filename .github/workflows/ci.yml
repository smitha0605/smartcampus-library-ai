name: SmartCampus Library AI — CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn clean compile -q

      - name: 🧪 Run JUnit 5 Tests
        run: mvn test

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

      - name: 📦 Package executable JAR
        run: mvn package -DskipTests -q

      - name: 🚀 Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartcampus-library-ai.jar
          path: target/smartcampus-library-ai.jar
          retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 📋 Verify Big-O Comments
        run: |
          echo "=== Checking Big-O documentation ==="
          grep -rn "Time:" src/main/java/ | wc -l
          echo "Big-O comments found"
